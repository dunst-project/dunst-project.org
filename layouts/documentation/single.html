{{ partial "head.html" . }}
{{ partial "header.html" . }}

    <div class="container">
        <div class="row">
            <div class="sixteen columns">
            <h1><b>{{ .Title }}</b></h1>

            {{ partial "doc-toc.html" . }}

            <hr>
            <h1><b>{{ .Params.subtitle }}</b> <div class="flabel">{{ .Params.lastdate }}</div></h1>

                {{ if eq .Params.toc "true" }}
                    {{.TableOfContents}}
                {{ end }}
                {{ .Content }}
            </div>
        </div>
    </div>

{{ partial "footer.html" . }}
{{ partial "tail.html" . }}
